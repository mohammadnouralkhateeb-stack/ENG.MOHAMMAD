search_matching_jobs_task:
  description: |
    ### Inputs:
    - **technical_skills:** {technical_skills}
    - **job_title:** {job_title}
    - **location:** {location}
    - **search_results:** {search_results}

    ### Task:
    Review the supplied live search results; do not attempt to call or invent search tools.
    1. Select relevant, apparently active job listings based only on the supplied results.
    2. Extract each listing's title, company, location, link, and a short reason it matches the candidate.
    3. Assign a numeric match score from 0 to 100 based on the candidate's skills and requested job.
    4. Return an empty list if no relevant listings are present.
    5. Format your final output strictly as a JSON list matching the expected structure.

  expected_output: >
    Return ONLY a JSON list (do NOT wrap it in ```json fences, start directly with [) using this exact structure:

    [
      {
        "job_title": "string",
        "company": "string",
        "location": "string",
        "description": "A short reason why the job matches the candidate.",
        "score": 85.0,
        "link": "https://example.com/job"
      }
    ]

  agent: job_search_agent